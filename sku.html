<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff5f7">
    <title>SKU Generator</title>
    <style>
      :root {
        --ink: #302329;
        --muted: #87777d;
        --line: #f0e3e7;
        --pink: #c36f89;
        --pink-dark: #a95370;
        --pink-soft: #fff0f4;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #fff8f9;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .card {
        width: min(460px, calc(100% - 32px));
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: white;
        box-shadow: 0 12px 35px rgb(31 42 35 / 5%);
      }

      h1 { margin: 0 0 8px; font-family: Georgia, serif; font-weight: 500; text-align: center; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
      label { display: block; margin: 15px 0 6px; font-size: 12px; font-weight: 700; }
      input, select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      button, a {
        display: inline-block;
        margin-top: 22px;
        padding: 11px 15px;
        border: 0;
        border-radius: 9px;
        background: var(--pink);
        color: white;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button:hover, a:hover { background: var(--pink-dark); }
      .result {
        min-height: 22px;
        margin-top: 22px;
        padding: 13px;
        border-radius: 9px;
        background: var(--pink-soft);
        color: var(--pink-dark);
        font-weight: 700;
      }
      .back { margin-left: 8px; background: #f2e8eb; color: var(--ink); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SKU Generator</h1>

      <label for="category">Category</label>
      <select id="category">
        <option value="" disabled selected>Select a category</option>
        <option value="Beverage">Beverage</option>
        <option value="Food">Food</option>
        <option value="Snack">Snack</option>
        <option value="Desert">Desert</option>
      </select>

      <label for="product-name">Product name</label>
      <select id="product-name">
        <option value="" disabled selected>Select a product</option>
        <option value="Americano">Americano</option>
        <option value="Spanish Latte">Spanish Latte</option>
        <option value="Cold Brew Malt">Cold Brew Malt</option>
        <option value="Affogato">Affogato</option>
        <option value="Caramel Macchiato">Caramel Macchiato</option>
      </select>

      <label for="quantity">Stock quantity</label>
      <input id="quantity" type="number" min="0" placeholder="e.g. 25">

      <button id="generate" type="button">Generate SKU</button>
      <a class="back" href="index.html">Back to receipt</a>
      <div class="result" id="result" aria-live="polite"></div>
    </main>

    <script>
      const category = document.getElementById("category");
      const productName = document.getElementById("product-name");
      const quantity = document.getElementById("quantity");
      const result = document.getElementById("result");

      document.getElementById("generate").addEventListener("click", () => {
        const sku = [
          category.value.slice(0, 3),
          productName.value.slice(0, 4),
          quantity.value
        ].map(part => part.toUpperCase()).join("-");

        result.textContent = `SKU: ${sku}`;
      });
    </script>
  </body>
</html>
